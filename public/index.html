<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow · Kanban</title>
    <style>
      :root { --encre: #101828; --doux: #3b4558; --bleu: #0a62d0; --marine: #0b1f5c; --fond: #f6f8fc; --ligne: #dde3ee; --vert: #0e9f6e; --corail: #e04848; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; color: var(--encre); background: var(--fond); }
      header { display: flex; align-items: center; gap: 24px; padding: 16px 28px; background: #fff; border-bottom: 1px solid var(--ligne); }
      h1 { margin: 0; font-size: 22px; color: var(--marine); }
      #modules { display: flex; gap: 8px; flex-wrap: wrap; }
      .mod { padding: 3px 10px; border-radius: 99px; font-size: 13px; background: #eef1f6; color: var(--doux); }
      .mod.ok { background: #e2f6ee; color: #0a7a55; }
      #outils { display: flex; gap: 10px; padding: 14px 28px; align-items: center; flex-wrap: wrap; }
      input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--ligne); border-radius: 8px; }
      #stats { margin-left: auto; color: var(--doux); }
      #message { min-height: 24px; padding: 0 28px; color: var(--corail); font-weight: 600; }
      main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 8px 28px 28px; }
      .col { background: #ebeff7; border-radius: 14px; padding: 12px; min-height: 300px; }
      .col h2 { margin: 0 0 10px; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--marine); }
      .carte { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(16, 24, 40, .08); }
      .carte .meta { display: flex; gap: 6px; margin-top: 6px; font-size: 12px; color: var(--doux); }
      .carte .meta span { background: #eef1f6; border-radius: 6px; padding: 1px 6px; }
      .carte.bug { border-left: 4px solid var(--corail); }
      .carte.story { border-left: 4px solid var(--bleu); }
      .carte.tache { border-left: 4px solid var(--vert); }
      .fleches { display: flex; justify-content: space-between; margin-top: 8px; }
      .fleches button { border: 0; background: #e6f0fc; color: var(--bleu); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
      .fleches button:disabled { visibility: hidden; }
    </style>
  </head>
  <body>
    <header>
      <h1>TaskFlow</h1>
      <div id="modules"></div>
    </header>
    <div id="outils">
      <input id="texte" placeholder="Rechercher (ex. login, securite)" />
      <select id="type"><option value="">Tous les types</option><option>story</option><option>bug</option><option>tache</option></select>
      <select id="priorite"><option value="">Toutes priorités</option><option value="1">1 · haute</option><option value="2">2 · moyenne</option><option value="3">3 · basse</option></select>
      <span id="stats"></span>
    </div>
    <div id="message"></div>
    <main id="tableau"></main>
    <script type="module" src="/public/app.js"></script>
  </body>
</html>
